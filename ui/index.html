<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freon Machine</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Aspecto de máquina: chasis gris oscuro, serigrafía en mayúsculas pequeñas, pantallas OLED blancas sobre negro y pilotos rojos. */
:root {
  --bg: #121212; --body: #1b1b1b; --panel: #222; --panel-2: #2a2a2a; --key: #2e2e2e; --key-hi: #383838;
  --line: #333; --line-2: #3d3d3d; --ink: #e9e7e1; --muted: #8d8b86; --dim: #5d5c59;
  --led: #ff4d2e; --led-glow: rgba(255, 77, 46, 0.45); --amber: #ffb02e; --green: #7bd88f; --blue: #6fb3ff;
  --oled-bg: #050505; --oled: #f4f1e8; --oled-dim: #8a877e;
  --f-label: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 3px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-mono); font-size: 12px; line-height: 1.4; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--oled); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1560px; margin: 0 auto; padding: 14px 16px 60px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.wrap > * { min-width: 0; }
#sec_mix { display: grid; gap: 12px; min-width: 0; }
.label { font-family: var(--f-label); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 11px; margin: 0; }

/* --- chasis y cabecera --- */
.dev { background: var(--body); border: 1px solid var(--line); border-radius: 6px; padding: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
.top { display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; }
.brand { display: grid; align-content: center; justify-items: start; gap: 4px; padding: 0 6px; }
.brand .logo { height: 86px; width: auto; color: var(--oled); display: block; filter: drop-shadow(0 0 6px rgba(244,241,232,0.12)); }
.brand b { font-family: var(--f-label); font-weight: 600; font-size: 22px; letter-spacing: 0.32em; }
.brand span { font-family: var(--f-label); font-size: 11px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; }
.screen { background: var(--oled-bg); color: var(--oled); border: 1px solid #000; border-radius: 4px; box-shadow: inset 0 0 0 1px #1d1d1d, inset 0 0 18px rgba(0,0,0,0.9);
  font-family: var(--f-mono); padding: 7px 12px; min-height: 34px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.screen .dim { color: var(--oled-dim); }
.top .screen { flex: 1; min-width: 280px; }
.conn { font-size: 11px; } .conn.ok::before, .conn.bad::before { content: "●"; margin-right: 6px; } .conn.ok::before { color: var(--green); } .conn.bad::before { color: var(--led); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.kbinfo { color: var(--dim); font-size: 11px; }

/* --- teclas --- */
.key { position: relative; background: var(--key); border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 10px 6px 18px; min-height: 30px;
  font-family: var(--f-label); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); cursor: pointer;
  box-shadow: 0 1px 0 #0a0a0a, inset 0 1px 0 rgba(255,255,255,0.05); }
.key::before { content: ""; position: absolute; left: 7px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: #3a1d17; }
.key:hover { background: var(--key-hi); }
.key:active { transform: translateY(1px); }
.key[aria-pressed="true"]::before, .key.held::before, .key.on::before { background: var(--led); box-shadow: 0 0 6px var(--led-glow); }
.key[aria-pressed="true"], .key.held { color: #fff; border-color: #5a2a20; }
.key.amber[aria-pressed="true"]::before { background: var(--amber); box-shadow: 0 0 6px rgba(255,176,46,.5); }
.key.plain { padding-left: 10px; } .key.plain::before { display: none; }
.key.plain[aria-pressed="true"] { background: var(--oled); color: #000; border-color: var(--oled); }
.key:disabled { opacity: 0.35; cursor: default; }
.key.danger { border-color: #6a2a20; }
.key.rec[aria-pressed="true"] { animation: blink 0.8s steps(2) infinite; }
@keyframes blink { 50% { border-color: var(--led); } }
.keys { display: grid; gap: 5px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
select, input[type="number"] { background: var(--oled-bg); color: var(--oled); border: 1px solid var(--line-2); border-radius: var(--r); padding: 5px 6px; font-size: 11.5px; min-height: 28px; max-width: 100%; }
.field { display: grid; gap: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }

/* --- knobs --- */
.knobs { display: flex; flex-wrap: wrap; gap: 8px 4px; }
.knob { display: grid; justify-items: center; gap: 1px; width: 66px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: ns-resize; padding: 2px 0; border-radius: var(--r); }
.knob svg { width: 40px; height: 40px; display: block; }
.knob .track { stroke: #353535; } .knob .arc { stroke: var(--oled); } .knob .cap { fill: #2a2a2a; stroke: #444; } .knob .dot { stroke: var(--oled); stroke-width: 2; }
.knob .kv { font-size: 10.5px; color: var(--oled); font-variant-numeric: tabular-nums; white-space: nowrap; }
.knob .kl { font-family: var(--f-label); font-weight: 600; font-size: 9.5px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); text-align: center; line-height: 1.1; overflow-wrap: normal; word-break: normal; }
.knob:hover .kl { color: var(--ink); }
.knob.sm { width: 46px; } .knob.sm svg { width: 30px; height: 30px; } .knob.sm .kv { font-size: 9.5px; } .knob.sm .kl { font-size: 9px; }
.knob.nolab .kl { display: none; }

/* --- tarjetas de pista --- */
.cards { display: grid; gap: 12px; }
.card { background: var(--body); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; display: grid; gap: 10px; }
.chead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.cname { display: grid; min-width: 120px; }
.cname b { font-family: var(--f-label); font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
.cname span { font-size: 10px; color: var(--dim); }
.act { width: 8px; height: 8px; border-radius: 50%; background: #3a1d17; flex: none; }
.act.on { background: var(--led); box-shadow: 0 0 8px var(--led-glow); }
.seg { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.card .screen { justify-content: space-between; }
.card.touched .screen .o2 { color: var(--amber); }
.grps { display: flex; flex-wrap: wrap; gap: 6px; }
.grp { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px 4px; display: grid; gap: 3px; align-content: start; }
.grp > .label { font-size: 10px; padding-left: 2px; }
.grp .knobs { flex-wrap: nowrap; gap: 4px 2px; }
.presets { display: grid; grid-template-columns: auto repeat(8, minmax(0, 1fr)) auto; gap: 4px; align-items: center; }
.presets .key { padding: 6px 4px 5px 14px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.presets .key::before { left: 5px; }
.presets .key.empty { color: var(--dim); font-style: italic; }
.presets .key.cur { border-color: var(--oled); }
.presets.saving .key:not(.save) { border-style: dashed; border-color: var(--led); }
.subbox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border-top: 1px dashed var(--line-2); padding-top: 8px; }

/* batería: todo a la vista */
.dgrid { display: grid; grid-template-columns: 74px repeat(8, minmax(0, 1fr)); gap: 2px 4px; align-items: center; }
.dgrid .rl { font-family: var(--f-label); font-weight: 600; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.dgrid .knob { width: 100%; }
.dgrid .lh { padding: 6px 2px 5px 14px; font-size: 11px; width: 100%; }
.dgrid .lh::before { left: 5px; }
.dgrid select { width: 100%; }
.dgrid .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 2px 0; }

/* --- directo --- */
.live { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 720px), 1fr)); }
.pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.pad { background: var(--key); border: 1px solid var(--line-2); border-radius: 4px; min-height: 58px; padding: 6px 7px; text-align: left; display: grid; align-content: space-between; cursor: pointer; touch-action: none;
  box-shadow: 0 1px 0 #0a0a0a; }
.pad .pn { font-size: 10px; color: var(--dim); } .pad .ps { font-family: var(--f-label); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pad[aria-current="true"] { border-color: var(--oled); }
.pad.hit { background: #4a1e15; border-color: var(--led); box-shadow: 0 0 12px var(--led-glow); }
.wave { width: 100%; height: 90px; display: block; background: var(--oled-bg); border: 1px solid #000; border-radius: 4px; cursor: ew-resize; touch-action: none; }
.wave.tall { height: 120px; cursor: default; }
.slices { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.slice { height: 26px; border-radius: 2px; background: var(--key); border: 1px solid var(--line-2); cursor: pointer; padding: 0; font-size: 9px; color: var(--dim); }
.slice.beat { border-color: #555; }
.slice.now { background: var(--led); border-color: var(--led); box-shadow: 0 0 8px var(--led-glow); color: #fff; }
.split { display: grid; gap: 10px; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); align-items: start; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.grmeter { display: inline-block; width: 120px; height: 8px; background: #111; border: 1px solid var(--line-2); border-radius: 2px; position: relative; vertical-align: middle; }
.grmeter i { position: absolute; right: 0; top: 0; bottom: 0; background: var(--amber); width: 0; }

/* --- mezcla --- */
.mixwrap { overflow-x: auto; padding-bottom: 6px; }
.mixrow { display: flex; gap: 4px; align-items: stretch; width: max-content; }
.unit { background: var(--body); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.unit > .units { flex: 1; }
.unit > .label { padding-left: 2px; }
.units { display: flex; gap: 4px; }
.strip { width: 112px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 5px; display: flex; flex-direction: column; gap: 5px; }
.strip .frow { margin-top: auto; }
.strip .sfoot { text-align: center; font-family: var(--f-label); font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .sname { display: grid; text-align: center; }
.strip .sname b { font-family: var(--f-label); font-weight: 600; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .sname span { font-size: 9.5px; color: var(--dim); }
.strip select { font-size: 10px; padding: 3px 4px; min-height: 24px; width: 100%; }
.strip .sk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 0; justify-items: center; }
.strip .sk .knob { width: 50px; }
.strip .sec { font-family: var(--f-label); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); border-top: 1px solid var(--line); padding-top: 3px; text-align: center; }
.strip.dim { opacity: 0.6; }
.strip.master { width: 132px; border-color: #4a4a4a; }
.frow { display: flex; gap: 6px; justify-content: center; align-items: stretch; }
.meter { width: 8px; height: 150px; background: #0b0b0b; border: 1px solid #000; border-radius: 1px; position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0; background: linear-gradient(to top, #e9e7e1 0 62%, var(--amber) 62% 86%, var(--led) 86%); clip-path: inset(100% 0 0 0); }
.fader { writing-mode: vertical-lr; direction: rtl; width: 26px; height: 150px; margin: 0; accent-color: var(--oled); }
.fread { font-size: 10px; color: var(--oled); text-align: center; }
.tms { display: flex; gap: 3px; }
.ms { flex: 1; height: 24px; border-radius: 2px; border: 1px solid var(--line-2); background: var(--key); font-family: var(--f-label); font-weight: 600; font-size: 11px; cursor: pointer; padding: 0; }
.ms[aria-pressed="true"].m { background: var(--led); border-color: var(--led); color: #fff; }
.ms[aria-pressed="true"].s { background: var(--amber); border-color: var(--amber); color: #000; }
.ms[aria-pressed="true"].c { background: var(--blue); border-color: var(--blue); color: #000; }
.limread { font-size: 10px; color: var(--amber); text-align: center; }
.fxgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.blk { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; display: grid; gap: 6px; align-content: start; }
.blk .bh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h2 { margin: 0; font-family: var(--f-label); font-weight: 600; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
h2 span { font-size: 11px; letter-spacing: 0.08em; color: var(--dim); text-transform: none; font-family: var(--f-mono); font-weight: 400; }
.notef input { width: 64px; }
@media (max-width: 720px) { .presets { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grp .knobs { flex-wrap: wrap; } .dgrid { grid-template-columns: 60px repeat(8, 70px); overflow-x: auto; } }
/* --- añadidos --- */
.dgrid .lh.on { background: #4a1e15; border-color: var(--led); color: #fff; box-shadow: 0 0 10px var(--led-glow); }
.dgrid .lh.on::before { background: var(--led); box-shadow: 0 0 6px var(--led-glow); }
.mfx { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; align-items: start; }
.mfx .keys { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); width: 100%; }
.mfx .key.on::before { background: var(--led); box-shadow: 0 0 6px var(--led-glow); }
@media (max-width: 900px) { .mfx { grid-template-columns: 1fr; } }
.mfx .blk { justify-items: center; text-align: center; }
.mfx .scenes { grid-column: 1 / -1; justify-items: stretch; }
#sysBox select, .row .field select { max-width: 100%; }
#sysBox .field { min-width: 0; max-width: 100%; flex: 1 1 150px; }
#sysBox .scrow { flex: 1 1 100%; }
.mfx .scrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mfx .blk .knob { width: 74px; } .mfx .blk .knob svg { width: 52px; height: 52px; }
.mfx .blk.live { border-color: #5a2a20; box-shadow: inset 0 0 0 1px rgba(255,77,46,.25); }
.zero { width: 100%; justify-content: center; }
.snaps { display: grid; grid-template-columns: auto repeat(8, minmax(0, 1fr)) auto auto auto; gap: 4px; align-items: center; }
.snaps .key { padding: 6px 4px 5px 14px; font-size: 11px; } .snaps .key::before { left: 5px; }
.snaps .key.empty { color: var(--dim); font-style: italic; }
.snaps.saving .key.slot { border-style: dashed; border-color: var(--led); }
.strip .rst { font-size: 10px; padding: 3px 4px 3px 12px; min-height: 22px; } .strip .rst::before { left: 4px; width: 4px; height: 4px; margin-top: -2px; }
.tuner { font-variant-numeric: tabular-nums; min-width: 110px; }
@media (max-width: 720px) { .snaps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.laybox { margin: 10px 0 4px; }
.layer { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; margin-top: 5px; }
.layer .lk { font-size: 10.5px; padding: 4px 5px; border: 1px solid var(--line, #333); border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer .lk i { font-style: normal; opacity: .5; margin-right: 4px; }
.layer .lk.none { opacity: .35; }
@media (max-width: 720px) { .layer { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.ctl8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px 4px; margin: 6px 0 12px; }
.kslot { display: flex; flex-direction: column; align-items: center; }
.kslot > i { font-style: normal; font-size: 9.5px; color: var(--dim); margin-top: 1px; letter-spacing: .04em; }
.kslot.none > span { color: var(--dim); padding: 18px 0 14px; }
.label.lrow { display: block; margin-top: 8px; }
@media (max-width: 720px) { .ctl8 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>

<script>
// ================================================================ connection to the engine
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } kids.forEach(k => e.append(k)); return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let SPEC = null, ST = {}, FILES = { samples: [], breaks: [], facSamples: [], facBreaks: [] }, ws = null, ready = false, retry = 500;
const WAVES = {}, LIVE = { slice: -1, head: 0, vgr: 0, rec: 0, recSec: 0, f0: 0, grains: [], seg: [] };
const pending = new Map();
function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { retry = 500; ws.send("hello"); setStatus(true); };
  ws.onclose = () => { ready = false; setStatus(false); setTimeout(connect, retry); retry = Math.min(4000, retry * 1.6); };
  ws.onmessage = (ev) => {
    const m = ev.data, sp = m.indexOf(" "), op = sp < 0 ? m : m.slice(0, sp), rest = sp < 0 ? "" : m.slice(sp + 1);
    if (op === "spec") SPEC = JSON.parse(rest);
    else if (op === "files") { FILES = JSON.parse(rest); if (ready) buildLive(); }
    else if (op === "state") { ST = JSON.parse(rest); ready = true; build(); }
    else if (op === "set") { const [k, v] = rest.split(" "); ST[k] = Number(v); onRemote(k); }
    else if (op === "sset") { const i = rest.indexOf(" "), k = i < 0 ? rest : rest.slice(0, i); ST[k] = i < 0 ? "" : rest.slice(i + 1); onRemote(k); }
    else if (op === "lvl") meters(rest.split(" "));
    else if (op === "live") liveStatus(rest.split(" "));
    else if (op === "wave") { const p = rest.split(" "); WAVES[p[0] + p[1]] = { dur: Number(p[2]), pk: p.slice(3).map(Number) }; drawWaves(); }
    else if (op === "rec") { LIVE.rec = Number(rest); drawRec(); }
    else if (op === "midimon") midiMon(rest);
    else if (op === "sys") { SYS = JSON.parse(rest); buildSys(); }
    else if (op === "sysst") sysStatus(rest.split(" "));
    else if (op === "knobwarn") { topMsg("Knob mode", "this controller sends absolute values: use Absolute or Pickup"); }
    else if (op === "saveerr") { if (rest === "1") topMsg("Warning", "the state could not be saved to disk"); }
  };
}
function setStatus(ok) { const s = $("#conn"); s.textContent = ok ? "Engine connected" : "No engine: is the program running?"; s.className = "conn " + (ok ? "ok" : "bad"); }
function send(k, v) {
  ST[k] = v; pending.set(k, v);
  (draws.get(k) || []).forEach(f => f());   // el mismo parámetro puede estar en varios sitios: se mueven todos a la vez
  if (pending.size === 1) requestAnimationFrame(() => { if (ws && ws.readyState === 1) pending.forEach((val, key) => ws.send(`set ${key} ${val}`)); pending.clear(); });
}
function sendRaw(s) { if (ws && ws.readyState === 1) ws.send(s); }
function topMsg(a, b) { const t = $("#topMsg"); t.textContent = b ? `${a} · ${b}` : a; t.className = ""; clearTimeout(topMsg.t); topMsg.t = setTimeout(() => { t.className = "dim"; }, 2000); }

// ================================================================ value formats
const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"], noteName = (n) => NOTE[((Math.round(n) % 12) + 12) % 12] + (Math.floor(Math.round(n) / 12) - 2);   // como el Oxi: 36 = C1, 60 = C3
const hz = (v) => (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : Math.round(v) + " Hz");
const secs = (v) => (v < 1 ? Math.round(v * 1000) + " ms" : v.toFixed(2) + " s");
const PCT = (v) => Math.round(v * 100) + "%";
const panf = (v) => (Math.abs(v) < 0.02 ? "C" : (v < 0 ? "L" : "R") + Math.round(Math.abs(v) * 100));
const djf = (v) => (v < -0.02 ? "LP " : v > 0.02 ? "HP " : "") + (Math.abs(v) > 0.02 ? Math.round(Math.abs(v) * 100) : "—");
const dbf = (v) => (v > 0 ? "+" : "") + (Math.round(v * 2) / 2) + " dB";
const lvlDb = (g) => (g <= 0.0001 ? "−∞" : (20 * Math.log10(g)).toFixed(1)) + " dB";
const limf = (v) => (v > -0.05 ? "Off" : v.toFixed(1) + " dB");
function fmtOf(p) {
  const names = p.names ? p.names.split("|") : null;
  switch (p.fmt) {
    case "p": return PCT;
    case "h": return hz;
    case "s": return (v) => (v <= 0.0005 && p.min === 0 ? "Off" : secs(v));
    case "t": return (v) => (v > 0.04 ? "+" : "") + (Math.abs(v - Math.round(v)) < 0.05 ? Math.round(v) : v.toFixed(1)) + " st";
    case "c": return (v) => (v > 0 ? "+" : "") + Math.round(v) + " ct";
    case "x": return (v) => "×" + (Math.abs(v - Math.round(v)) < 0.005 ? Math.round(v) : v.toFixed(2));
    case "i": return (v) => Math.round(v) + (p.names ? " " + p.names : "");
    case "n": return (v) => names[clamp(Math.round(v - p.min), 0, names.length - 1)] ?? String(v);
    case "f": return (v) => (Math.abs(v) >= 10 ? Math.round(v) : v.toFixed(1)) + (p.names ? " " + p.names : "");
    case "d": return djf;
    case "o": case "pan": return panf;
    case "g": return (v) => (v <= -79.5 ? "Off" : Math.round(v) + " dB");
    case "b": return (v) => (Math.abs(v) < 0.01 ? "0" : (v > 0 ? "+" : "−") + Math.round(Math.abs(v) * 100));
    case "m": return noteName;
    default: return String;
  }
}

// ================================================================ knob
function makeKnob({ label, min, max, step = 1, get, set, fmt = (v) => String(v), def, cls = "" }) {
  const root = el("div", { class: "knob " + cls, role: "slider", tabindex: "0", "aria-label": label });
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 44 44");
  const mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); svg.append(n); return n; };
  const R = 18, C = 22, A0 = 135, SPAN = 270;
  const arcPath = (a0, a1) => { const p = (a) => [C + R * Math.cos((a * Math.PI) / 180), C + R * Math.sin((a * Math.PI) / 180)]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  mk("path", { d: arcPath(A0, A0 + SPAN), class: "track", fill: "none", "stroke-width": "2.5" });
  const arc = mk("path", { d: "", class: "arc", fill: "none", "stroke-width": "2.5" });
  mk("circle", { cx: C, cy: C, r: 13, class: "cap" });
  const dot = mk("line", { x1: C, y1: C, x2: C, y2: C - 11, class: "dot", "stroke-linecap": "round" });
  const kv = el("span", { class: "kv" }), kl = el("span", { class: "kl" }, label);
  root.append(svg, kv, kl);
  const cl = (v) => Math.min(max, Math.max(min, Math.round(v / step) * step));
  function draw() {
    const v = get();
    if (v == null || Number.isNaN(v)) { kv.textContent = "—"; arc.setAttribute("d", ""); return; }
    const f = (v - min) / (max - min || 1), a = A0 + f * SPAN;
    arc.setAttribute("d", f > 0.001 ? arcPath(A0, Math.max(A0 + 0.5, a)) : "");
    dot.setAttribute("x2", (C + 11 * Math.cos((a * Math.PI) / 180)).toFixed(2)); dot.setAttribute("y2", (C + 11 * Math.sin((a * Math.PI) / 180)).toFixed(2));
    dot.setAttribute("x1", (C + 4 * Math.cos((a * Math.PI) / 180)).toFixed(2)); dot.setAttribute("y1", (C + 4 * Math.sin((a * Math.PI) / 180)).toFixed(2));
    kv.textContent = fmt(v); root.setAttribute("aria-valuenow", v); root.setAttribute("aria-valuetext", fmt(v));
  }
  function change(v) { if (get() == null) return; const n = cl(v); if (n !== get()) { set(n); draw(); } }
  let dragY = 0, dragV = 0, dragging = false;
  root.addEventListener("pointerdown", (e) => { if (get() == null) return; dragging = true; dragY = e.clientY; dragV = get(); root.setPointerCapture(e.pointerId); });
  root.addEventListener("pointermove", (e) => { if (!dragging) return; const px = e.shiftKey ? 600 : 160; change(dragV + ((dragY - e.clientY) / px) * (max - min)); });
  const end = () => { dragging = false; };
  root.addEventListener("pointerup", end); root.addEventListener("pointercancel", end);
  root.addEventListener("wheel", (e) => { if (!e.altKey || get() == null) return; e.preventDefault();   // el scroll mueve la página; solo con ⌥ mueve el knob
    change(get() + (e.deltaY < 0 ? step : -step) * (e.shiftKey ? 1 : Math.max(1, Math.round((max - min) / step / 60)))); }, { passive: false });
  root.addEventListener("keydown", (e) => {
    const big = Math.max(step, Math.round((max - min) / 10 / step) * step);
    const d = { ArrowUp: step, ArrowRight: step, ArrowDown: -step, ArrowLeft: -step, PageUp: big, PageDown: -big }[e.key];
    if (d) { e.preventDefault(); e.stopPropagation(); change(get() + d); }
  });
  root.addEventListener("dblclick", () => { if (def != null) change(def); });
  return { root, draw };
}
function specKnob(box, key, p, onTouch, cls = "", label) {
  const fmt = fmtOf(p), lab = label ?? p.l;

const meterState = [];

  const act = rest.slice(0, di >= 0 ? di : bi).map(Number), dact = di >= 0 ? rest.slice(di + 1, si).map(Number) : [], sact = si >= 0 ? rest.slice(si + 1, bi).map(Number) : [];

  const bpm = Number(rest[bi + 1]), clk = rest[bi + 3] === "1", gr = Number(rest[bi + 5]), ci = rest.indexOf("cpu"), cpu = ci >= 0 ? Number(rest[ci + 1]) : 0, bci = rest.indexOf("bcgr"), bcgr = bci >= 0 ? Number(rest[bci + 1]) : 0;
  if (mixUI.bcRead) mixUI.bcRead.textContent = bcgr < -0.05 ? `Compressing ${Math.abs(bcgr).toFixed(1)} dB` : "No reduction";
  const cp = $("#topCpu"); if (cp) { cp.textContent = `CPU ${cpu.toFixed(0)}%`; cp.style.color = cpu > 70 ? "var(--led)" : cpu > 45 ? "var(--amber)" : ""; }
  lv.forEach((v, i) => {

  const tt = `♩ ${bpm.toFixed(1)} · ${clk ? "Oxi clock" : "screen tempo"}`;

// --- MIDI monitor: open ports and the last message that arrived
const MIDI = { ports: "", count: 0 };
function midiMon(rest) {
  const tab = rest.indexOf("\t"), head = (tab < 0 ? rest : rest.slice(0, tab)).split(" "), ports = tab < 0 ? "" : rest.slice(tab + 1);
  const c = Number(head[0]), st = Number(head[1]), d1 = Number(head[2]), d2 = Number(head[3]), port = head.slice(4).join(" ");
  MIDI.ports = ports; const t = $("#topMidi");

    const what = ty === 0x90 && d2 > 0 ? `note ${noteName(d1)} (${d1}) vel ${d2}` : ty === 0x80 || ty === 0x90 ? `note off ${noteName(d1)}` : ty === 0xB0 ? `CC ${d1} = ${d2}` : `0x${st.toString(16)}`;
    t.textContent = `MIDI ← ${port} · ch ${ch} · ${what}`; t.className = ""; clearTimeout(midiMon.t); midiMon.t = setTimeout(() => (t.className = "dim"), 1500);
  } else if (!c) t.textContent = ports ? `MIDI: ${ports} · nothing received yet` : "MIDI: no inputs";

}

// --- System: everything that affects how Freon runs, without a terminal
let SYS = null, sysTimer = null;
function buildSys() {
  const box = $("#sysBox"); if (!box || !SYS) return; box.textContent = "";

  const a = sel("Audio output", SYS.audio, devPairs(SYS.outs)), i = sel("Audio inputs", SYS.entrada, devPairs(SYS.ins, true));
  const b = sel("Buffer", SYS.buffer, [64, 128, 256, 512, 1024, 2048].filter(n => n >= (SYS.minbuf || 64)).map(n => [n, `${n} · ${(1000 * n / SYS.rate).toFixed(1)} ms`]));
  const q = sel("Safety blocks", SYS.bloques, [[2, "2 · lowest delay"], [3, "3 · balanced"], [4, "4 · safest"]]);

  const c = sel("CPU cores", SYS.nucleos, Array.from({ length: SYS.hw }, (_, k) => [k + 1, String(k + 1)]));
  const o = sel("Outputs", SYS.salidas, [[16, "All"], [8, "8"], [6, "6"], [4, "4"], [2, "2"]]);
  // routing: which outputs of the interface are the main mix and the cue, and which interface input feeds each Freon input
  const nout = Math.max(2, SYS.nout || 2), nin = Math.max(2, SYS.nin || 2), prs = Array.from({ length: nout >> 1 }, (_, k) => [2 * k + 1, `${2 * k + 1}-${2 * k + 2}`]);
  box.append(el("p", { class: "hint" }, "Outputs and inputs below change at once, no restart:"));

  const ens = [0, 1, 2, 3].map(q => sel(`Freon input ${q + 1}`, (SYS.ents || [1, 2, 3, 4])[q], [[0, "None"], ...Array.from({ length: nin }, (_, k) => [k + 1, "Interface in " + (k + 1)])]));

  live("principal", mo); live("cue", co); ens.forEach((e, q) => live("ent" + (q + 1), e));

  [a, i, b, q, r, c, o].forEach(x => x.addEventListener("change", markPend)); mid.addEventListener("click", markPend);

  box.append(mid, pend, acts, el("p", { class: "hint" }, `Now: ${SYS.cur || "no audio"}${SYS.curIn ? " · in: " + SYS.curIn : ""} · output delay about ${(1000 * SYS.buffer * SYS.bloques / SYS.rate).toFixed(0)} ms`), el("p", { class: "hint", id: "sysStat" }, "…"));

// --- Computer keyboard
const KB = "awsedftgyhujkolp";
const kbHeld = new Map();
const KBT = { 0: "T1 Drums", 1: "T2", 2: "T3", 3: "T4", 10: "Sampler", 12: "Granular", 13: "Voice", 20: "Sub" };
document.addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || /input|select|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "z") { ui.kbOct = Math.max(1, ui.kbOct - 1); kbInfo(); return; }
  if (k === "x") { ui.kbOct = Math.min(7, ui.kbOct + 1); kbInfo(); return; }
  const tk = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 10, 6: 12, 7: 13, 8: 20 }[k];
  if (tk != null) { ui.kbTrack = tk; saveUi(); kbInfo(); return; }
  const i = KB.indexOf(k); if (i < 0 || !ready) return;
  const t = ui.kbTrack, n = t === 0 ? ST[`d.l${i % 8}.note`] : t === 10 ? 36 + i : 12 * (ui.kbOct + 1) + i;
  if (t === 10) padHit(i); else sendRaw(`kb ${t} ${n} 105`);
  kbHeld.set(k, [t, n]);
});
document.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (kbHeld.has(k)) { const [t, n] = kbHeld.get(k); sendRaw(`kb ${t} ${n} 0`); kbHeld.delete(k); } });
// si la ventana pierde el foco con una tecla pulsada, el keyup no llega nunca: se sueltan aquí para que no se quede colgada
const kbRelease = () => { kbHeld.forEach(([t, n]) => sendRaw(`kb ${t} ${n} 0`)); kbHeld.clear(); };
window.addEventListener("blur", kbRelease);
document.addEventListener("visibilitychange", () => { if (document.hidden) kbRelease(); });
function kbInfo() { $("#kbInfo").textContent = `Computer keyboard → ${KBT[ui.kbTrack] || "T2"}${[1, 2, 3, 12, 13, 20].includes(ui.kbTrack) ? " · octave " + ui.kbOct : ""}   (1-4 tracks · 5 sampler · 6 granular · 7 voice · 8 sub · A W S E D… notes · Z / X octave)`; saveUi(); }

$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.t); });
